# dsh-agents-in-the-loop — live configuration (npm name; repo keeps agents-in-the-loop)
# Cross-session call center: session_message + contacts.
# UI intentionally removed in v1.3.0 (host functionality only).
# SECURITY: gitignored — local session ids, never commit.
# NOTE: this file ships the PUBLISHED-SAFE defaults (everything off).
# TESTING values (enabled: true, real paths, allTools: true) belong ONLY
# in the live root overlay ~/.dsh/profiles/web/cordis.patch.yml, which
# overrides this file on conflict.

- insert:
    - id: dsh-agents-in-the-loop
      name: dsh-agents-in-the-loop
      disabled: false
      config:
        enabled: false        # published default; TESTING deployments flip true in the LIVE overlay
        sessionMessage:
          enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
          maxChars: 8000      # per-message cap; longer text is truncated with a note
        contacts:
          enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
          file: '~/.dsh/taskboard-flow-contacts.json'
        # v1.8.0 — spawn_session tool. Published default OFF; model/provider
        # are pinned here and NEVER selectable per call.
        spawn:
          enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
          maxSessions: 9
          preset: ''            # default preset; '' = caller must pass one
          allowedPresets: []    # empty = any resolvable preset
          provider: zai-coding-cn
          model: glm-5.3-flash
          reasoningEffort: ''   # '' = unset
          allowedModels: [zai-coding-cn/glm-5.3-flash, openai-codex/gpt-6-luna]
          workspaces: []        # workspace-id allowlist; empty = caller default only
          allowedPermissions: [read-only, workspace-write]
          stateFile: '~/.dsh/spawned-sessions.json'
        # v1.9.0/v1.10.0 — MCP endpoint + inbox/callcenter.
        mcp:
          enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
          path: /api/agents-in-the-loop/mcp
          apiKeyFile: ~/.dsh/aitl-mcp-key.json
          callerId: session-mcp-external
          allowNonLoopback: false
          tools: [contacts, session_message, spawn_session]
          allTools: false       # ⚠ true = FULL machine control for key holders (TESTING only, live overlay)
          identityHeader: x-aitl-identity
          inbox:                # v1.10.0 maildrop + contacts-in-SQLite
            enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
            file: ~/.dsh/aitl.db
            maxChars: 8000
            maxPending: 100
            retentionDays: 7
            redeliverAfterMin: 5
            identityHeader: x-aitl-identity
            panel:
              enabled: false    # published default; TESTING deployments flip true in the LIVE overlay
          bridge:               # phase 2 (harness tool bridging) — not implemented yet
            enabled: false
            allowedTools: []
        # DSH-MC-1 — Mission Control runtime (SSE → spawn/deliver/close).
        # Key file: JSON {"key":"mca_…"}; never logged, never printed.
        mc:
          enabled: false      # published default; TESTING deployments flip true in the LIVE overlay
          url: 'http://127.0.0.1:9999'
          apiKeyFile: '~/.dsh/mc-runtime-key.json'      # placeholder — set the real path in the live overlay
          maxSessions: 9
          silentMinutes: 20
          excludedContacts: [dsh-maintainer]
          provider: zai-coding-cn
          model: glm-5.3-flash
          projects:
            sandbox:
              workspaceId: '00000000-0000-0000-0000-000000000000'   # placeholder — set the real workspace in the live overlay
              firstMessage: '~/.dsh/mc-first-message.txt'           # placeholder — set the real path in the live overlay
              rules: 'TEST task: no code, no git, no repo or Atlas edits; MC tools only.'
