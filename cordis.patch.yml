# dsh-agents-in-the-loop — live configuration (npm name; repo keeps agents-in-the-loop)
# Cross-session call center: session_message + contacts.
# UI intentionally removed in v1.3.0 (host functionality only).
# Contacts store keeps the historical path so pre-rename contacts survive:
# ~/.dsh/taskboard-flow-contacts.json
# SECURITY: gitignored — local session ids, never commit.

- insert:
    - id: dsh-agents-in-the-loop
      name: dsh-agents-in-the-loop
      disabled: false
      config:
        enabled: false        # published default; TESTING deployments flip true in the LIVE overlaysessionMessage:
          enabled: false        # published default; TESTING deployments flip true in the LIVE overlaymaxChars: 8000   # per-message cap; longer text is truncated with a note
        contacts:
          enabled: false        # published default; TESTING deployments flip true in the LIVE overlayfile: '~/.dsh/taskboard-flow-contacts.json'
        # v1.8.0 — spawn_session tool (in-process session creation, same
        # faces dsh-taskboard uses). Enabled LIVE for testing (Mark 2026-10-08);
        # published default must return to false before npm release.
        # Model/provider are pinned here and NEVER selectable per call.
        mcp:
          enabled: false        # published default; TESTING deployments flip true in the LIVE overlay
          path: /api/agents-in-the-loop/mcp
          apiKeyFile: ~/.dsh/aitl-mcp-key.json
          callerId: session-mcp-external
          allowNonLoopback: false
          tools: [contacts, session_message, spawn_session]
          allTools: false        # ⚠ true = FULL machine control for key holders (Mark directive 2026-10-09; TESTING only in live overlay)
          inbox:                # v1.10.0 maildrop + contacts-in-SQLite
            enabled: false        # published default; TESTING deployments flip true in the LIVE overlay
            file: ~/.dsh/aitl.db
            maxChars: 8000
            maxPending: 100
            retentionDays: 7
            redeliverAfterMin: 5
            identityHeader: x-aitl-identity
            panel:
              enabled: false        # published default; TESTING deployments flip true in the LIVE overlaybridge:
            enabled: false      # phase 2 (harness tool bridging) — not implemented yet
            allowedTools: []
        spawn:
          enabled: false        # published default; TESTING deployments flip true in the LIVE overlaymaxSessions: 9
          preset: ''            # default preset; '' = caller must pass one
          allowedPresets: []    # empty = any resolvable preset
          provider: zai-coding-cn
          model: glm-5.3-flash
          reasoningEffort: ''   # '' = unset
          allowedModels: [zai-coding-cn/glm-5.3-flash, openai-codex/gpt-6-luna]
          workspaces: []        # workspace-id allowlist; empty = caller default only
          allowedPermissions: [read-only, workspace-write]
          stateFile: '~/.dsh/spawned-sessions.json'
        # DSH-MC-1 — Mission Control runtime (SSE → spawn/deliver/close).
        # Key file: JSON {"key":"mca_…"}; never logged, never printed.
        mc:
          enabled: false        # published default; TESTING deployments flip true in the LIVE overlayurl: 'http://127.0.0.1:9999'
          apiKeyFile: '~/.dsh/mc-runtime-key.json   # placeholder — set your real path in the live overlay'
          maxSessions: 9
          silentMinutes: 20
          excludedContacts: [dsh-maintainer]
          provider: zai-coding-cn
          model: glm-5.3-flash
          projects:
            sandbox:
              workspaceId: '8008e180-a231-4007-a035-cd15c9807066'
              firstMessage: '~/.dsh/mc-first-message.txt  # placeholder — set your real path in the live overlay'
              rules: 'TEST task: no code, no git, no repo or Atlas edits; MC tools only.'
